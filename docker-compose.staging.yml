services:
  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_started
      api:
        condition: service_healthy
      whatsapp-gateway:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    restart: unless-stopped
    env_file:
      - path: ${APP_ENV_FILE:-.env.staging}
        required: true
    environment:
      NODE_ENV: production
    expose:
      - "4173"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'wget -qO- http://localhost:4173/ >/dev/null || exit 1',
        ]
      interval: 20s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bolao}
      POSTGRES_USER: ${POSTGRES_USER:-bolao}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bolao} -d ${POSTGRES_DB:-bolao}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - path: ${APP_ENV_FILE:-.env.staging}
        required: true
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-bolao}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-bolao}
      ENVIRONMENT: staging
      WHATSAPP_PROVIDER: baileys
      WHATSAPP_GATEWAY_URL: http://whatsapp-gateway:3001
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      whatsapp-gateway:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             python -m app.infrastructure.db.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --no-access-log"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; urllib.request.urlopen(''http://localhost:8000/health'').read()"',
        ]
      interval: 20s
      timeout: 5s
      retries: 10

  whatsapp-gateway:
    build:
      context: ./whatsapp-gateway
    restart: unless-stopped
    environment:
      PORT: 3001
      BAILEYS_AUTH_DIR: /app/auth
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - baileys_auth:/app/auth
    expose:
      - "3001"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
  redis_data:
  baileys_auth:
