name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  backend:
    name: Backend quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Run backend tests
        run: pytest

      - name: Compile backend
        run: python -m compileall backend/app

  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install frontend dependencies
        run: npm install

      - name: Typecheck, lint and build
        run: npm run test:frontend

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -t bolaoialab-api:ci ./backend

      - name: Build WhatsApp gateway image
        run: docker build -t bolaoialab-whatsapp-gateway:ci ./whatsapp-gateway

  deploy-staging:
    name: Deploy staging
    runs-on: ubuntu-latest
    needs:
      - docker
    if: github.ref == 'refs/heads/main'
    environment: staging
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
    steps:
      - name: Deploy over SSH
        if: ${{ env.STAGING_HOST != '' }}
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd ${{ secrets.STAGING_APP_DIR }}
            git pull --ff-only
            docker compose -f docker-compose.staging.yml up -d --build
            docker compose -f docker-compose.staging.yml ps
